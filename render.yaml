services:
  - type: web
    name: umair-ali-portfolio
    runtime: static
    buildCommand: echo "Static site, no build needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
